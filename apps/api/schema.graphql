type Mutation {
  beginViewOnlySession: Boolean!
  buildDelegate(input: BuildDelegateInput!): UnsignedDelegateView!
  cancelRecovery(signedDelegate: String!): RecoveryView!
  cancelSupportRecovery: SupportCaseView!
  confirmPhone: Boolean!
  confirmSupportRecovery(newPublicKey: String!, token: String!): SupportRequestReceipt!
  createAccount(input: CreateAccountInput!): Boolean!
  createInvoice(input: CreateInvoiceInput!): CreatedInvoice!
  markNotificationsRead(upToId: String!): Int!
  openSupportRecovery(newPublicKey: String!): SupportCaseView!
  prepareInternalTestPayment(input: SandboxRequestInput!): InternalTestPayment!
  prepareInvoicePayment(invoiceId: String!): PreparedOp!
  prepareLimitChange(newLimit: String!): AccountCall!
  prepareTokenEnable(token: String!): AccountCall!
  prepareTransfer(input: PrepareTransferInput!): PreparedOp!
  prepareWithdrawal(input: PrepareWithdrawalInput!): PreparedWithdrawal!
  quoteDeposit(input: StartDepositInput!): QuoteView!
  quoteWithdrawal(input: PrepareWithdrawalInput!): QuoteView!
  registerDevice(publicKey: String!): DeviceResult!
  registerProfile(input: RegisterProfileInput!): Me!
  registerRecoveryKit(devicePublicKey: String!, deviceSignature: String!, kitPublicKey: String!): RecoveryKitStatus!
  requestCosign(deviceSignature: String!, opId: String!): PreparedOp!
  requestLimitRaise(newLimit: String!): AccountCall!
  requestPasswordReset(email: String!): Boolean!
  requestSupportRecovery(email: String!, newPhone: String!): Boolean!
  sandboxSubmit(input: SandboxRequestInput!): SandboxReceiptView!
  sendVerificationEmail: Boolean!
  signOutEverywhere: Boolean!
  startDeposit(input: StartDepositInput!): DepositInstructions!
  startInvoicePayment(input: StartInvoicePaymentInput!): InvoicePayment!
  startRecovery(kitSignature: String, newPublicKey: String!): RecoveryView!
  submitAccountCall(callId: String!, signedDelegate: String!): AccountCall!
  submitSignedOp(idempotencyKey: String!, opId: String!, signedDelegate: String!): SubmitResult!
}

