type Query {
  account: AccountView!
  accountCall(callId: String!): AccountCall
  accountNameAvailability(name: String!): AccountNameAvailability!
  activity(before: String, first: Int! = 20): [ActivityItem!]!
  assembleSignedDelegate(delegateBase64: String!, signatureBase64: String!): String!
  balances: [Balance!]!
  cancelRecoveryCall: CancelRecoveryCall!
  demoBalance: Balance!
  deposit(id: String!): DepositInstructions
  depositOptions: [DepositOption!]!
  deposits(first: Int! = 20): [DepositInstructions!]!
  devices: [DeviceView!]!
  directDeposit: DirectDeposit!
  indicativeRate: IndicativeRate
  invoice(invoiceId: String!): InvoiceView
  invoicePayOptions: [DepositOption!]!
  invoicePayment(paymentId: String!): InvoicePayment
  me: Me!
  merchantInvoices(before: String, first: Int! = 20): [MerchantInvoice!]!
  notifications(first: Int! = 20): [NotificationView!]!
  op(opId: String!): OpView
  pendingActivity: [PendingItem!]!
  recipient(query: String!): Recipient
  recovery: RecoveryView
  recoveryChallenge(newPublicKey: String!): RecoveryChallenge!
  recoveryKit: RecoveryKitStatus!
  remittanceCorridors: [RemittanceCorridor!]!
  sandboxCatalog: SandboxCatalog!
  sandboxOp(id: String!): SandboxReceiptView
  sandboxOps(first: Int! = 20): [SandboxReceiptView!]!
  sandboxQuote(input: SandboxRequestInput!): SandboxQuoteView!
  spendingLimit: SpendingLimit!
  supportCase: SupportCaseView
  supportLink(token: String!): SupportLinkView
  supportRequestStatus(caseId: String!, statusToken: String!): SupportRequestStatus
  tokensToEnable: [String!]!
  transaction(id: String!): TransactionView
  withdrawal(id: String!): WithdrawalView
  withdrawalOptions: [WithdrawalOption!]!
  withdrawals(first: Int! = 20): [WithdrawalView!]!
}

